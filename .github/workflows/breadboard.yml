name: breadboard host and electrical layer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  breadboard:
    # Pinned rather than ubuntu-latest, which migrates to Ubuntu 26 in Oct 2026.
    runs-on: ubuntu-24.04
    # Was 15 before the breadboard gate took on ngspice-rs: faer, diffsol,
    # nalgebra and their transitive crates are compiled in both debug and release
    # on a cold cache, which dominates the job.
    timeout-minutes: 30
    steps:
      # The engine is consumed from crates.io, so no sibling checkout and no
      # submodule are needed. The engine's own gate and the converted AVR8js
      # contract run in their own repositories.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned rather than @stable: a new stable release can promote clippy lints
      # to errors and break the gate. Bump deliberately, together with any lint
      # fixes the newer toolchain requires.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: Verify the breadboard host and external components
        run: bash breadboard/tools/verify-breadboard.sh
      - name: Verify blink-gui compiles against the published engine
        run: cargo check --manifest-path blink-gui/Cargo.toml --all-targets --locked
