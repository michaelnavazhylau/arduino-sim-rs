name: Native AVR parity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-parity:
    # Pinned rather than ubuntu-latest, which migrates to Ubuntu 26 in Oct 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      # Pinned rather than @stable: a new stable release can promote clippy lints
      # to errors and break the gate. Bump deliberately, together with any lint
      # fixes the newer toolchain requires.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rust_port/tools/package-lock.json
      - name: Verify native suites in debug and release
        run: bash rust_port/tools/verify-native.sh
      - name: Verify breadboard host and external components
        run: bash breadboard/tools/verify-breadboard.sh
      - name: Install pinned conversion tooling
        run: npm --prefix rust_port/tools ci --ignore-scripts
      - name: Verify deterministic conversion and source hashes
        run: npm --prefix rust_port/tools run check
