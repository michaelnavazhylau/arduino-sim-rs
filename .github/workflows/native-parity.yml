name: Native AVR engine and breadboard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    # Pinned rather than ubuntu-latest, which migrates to Ubuntu 26 in Oct 2026.
    runs-on: ubuntu-24.04
    # Raised from 15 when the breadboard gate took on ngspice-rs: faer, diffsol,
    # nalgebra and their transitive crates are compiled in both debug and release
    # on a cold cache, which dominates the job.
    timeout-minutes: 30
    steps:
      # The pinned avr8js submodule is a read-only reference for this port's
      # compatibility claims and is not needed by either gate. The converted
      # contract, the converter and the deterministic-conversion check live in
      # the avr8js-parity repository, which verifies itself.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned rather than @stable: a new stable release can promote clippy lints
      # to errors and break the gate. Bump deliberately, together with any lint
      # fixes the newer toolchain requires.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: Verify the avr-sim engine and its regressions
        run: bash rust_port/tools/verify-native.sh
      - name: Verify breadboard host and external components
        run: bash breadboard/tools/verify-breadboard.sh
